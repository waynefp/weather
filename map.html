<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmosphera — Global Weather Map</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['DM Serif Display', 'serif'],
          },
          colors: {
            ink: '#0d0f14', mist: '#8b9ab3', frost: '#c8d8f0',
            sky: '#4a90d9', aurora: '#7fdbca', storm: '#4b5f7c',
          },
        },
      },
    };
  </script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background-color: #0d0f14;
      color: #e8edf5;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 999; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Nav */
    .nav-glass {
      background: rgba(13,15,20,0.75);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(200,216,240,0.06);
    }

    /* Map fills everything below nav */
    #map {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* Slightly desaturate base tiles to match dark theme */
    .leaflet-tile-pane { filter: brightness(0.88) saturate(0.65); }

    /* Layer switcher pill */
    .layer-switcher {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      background: rgba(13,15,20,0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(200,216,240,0.1);
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
    }
    .layer-btn {
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #8b9ab3;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      background: transparent;
      font-family: 'Outfit', sans-serif;
    }
    .layer-btn:hover { color: #e8edf5; }
    .layer-btn.active {
      background: rgba(74,144,217,0.18);
      color: #4a90d9;
      border-color: rgba(74,144,217,0.3);
    }

    /* Crosshair on map */
    .leaflet-container { cursor: crosshair !important; }
    .leaflet-grab { cursor: grab !important; }
    .leaflet-dragging .leaflet-grab { cursor: grabbing !important; }
    .leaflet-interactive { cursor: crosshair !important; }

    /* ── Leaflet popup overrides ── */
    .leaflet-popup-content-wrapper {
      background: rgba(16, 19, 26, 0.96) !important;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(200,216,240,0.1) !important;
      border-radius: 1.25rem !important;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      width: 272px !important;
    }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-close-button {
      color: #8b9ab3 !important;
      font-size: 18px !important;
      top: 10px !important;
      right: 12px !important;
      z-index: 10;
    }
    .leaflet-popup-close-button:hover { color: #e8edf5 !important; background: none !important; }

    /* Popover content */
    .pop-inner { padding: 20px 20px 18px; font-family: 'Outfit', sans-serif; }
    .pop-label  { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4a90d9; margin-bottom: 4px; }
    .pop-city   { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: #e8edf5; margin-bottom: 14px; line-height: 1.2; }
    .pop-temp-row { display: flex; align-items: flex-end; gap: 5px; margin-bottom: 3px; }
    .pop-temp   { font-family: 'DM Serif Display', serif; font-size: 2.8rem; line-height: 1; color: #e8edf5; }
    .pop-unit   { font-size: 1.1rem; color: #8b9ab3; padding-bottom: 4px; }
    .pop-desc   { font-size: 0.78rem; color: #8b9ab3; margin-bottom: 14px; }
    .pop-divider { height: 1px; background: rgba(200,216,240,0.07); margin-bottom: 14px; }
    .pop-stats  { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .pop-stat-lbl { font-size: 0.63rem; color: #8b9ab3; text-transform: uppercase; letter-spacing: 0.06em; }
    .pop-stat-val { font-size: 0.88rem; color: #e8edf5; font-weight: 500; margin-top: 2px; }
    .pop-btn {
      width: 100%; padding: 10px 12px;
      background: rgba(74,144,217,0.12);
      border: 1px solid rgba(74,144,217,0.28);
      border-radius: 0.75rem;
      color: #4a90d9;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      font-family: 'Outfit', sans-serif;
    }
    .pop-btn:hover { background: rgba(74,144,217,0.22); border-color: rgba(74,144,217,0.5); }
    .pop-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pop-loading {
      padding: 24px 20px; text-align: center;
      font-size: 0.78rem; color: #8b9ab3;
      font-family: 'Outfit', sans-serif;
    }

    /* Coordinates badge */
    .coords-badge {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      background: rgba(13,15,20,0.82); backdrop-filter: blur(12px);
      border: 1px solid rgba(200,216,240,0.08);
      border-radius: 999px; padding: 5px 14px;
      font-size: 0.68rem; color: #8b9ab3;
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s ease;
      font-family: 'Outfit', sans-serif;
    }
    .coords-badge.show { opacity: 1; }

    /* Tag */
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;
      border: 1px solid rgba(200,216,240,0.12);
      background: rgba(200,216,240,0.04); color: #8b9ab3;
    }

    /* Pulse ring */
    @keyframes pulseRing {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .pulse-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(74,144,217,0.5); animation: pulseRing 2s ease-out infinite; }

    /* Briefing loading overlay */
    #briefing-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(13,15,20,0.92); backdrop-filter: blur(20px);
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #briefing-overlay.show { display: flex; }
    .briefing-spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(200,216,240,0.08);
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loadingSpin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ═══ NAV ═══ -->
  <nav class="nav-glass fixed top-0 left-0 right-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

      <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
        <div class="relative w-8 h-8">
          <div class="pulse-ring"></div>
          <svg viewBox="0 0 32 32" fill="none" class="w-8 h-8 relative z-10">
            <circle cx="16" cy="16" r="6" fill="#4a90d9"/>
            <path d="M16 4v4M16 24v4M4 16h4M24 16h4" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
            <path d="M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M7.5 24.5l2.8-2.8M21.7 10.3l2.8-2.8" stroke="#7fdbca" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
          </svg>
        </div>
        <span class="font-serif text-xl tracking-tight text-white">Atmosphera</span>
      </a>

      <span class="hidden md:block font-serif text-base italic text-mist/50">Global Weather Map</span>

      <div class="flex items-center gap-4">
        <a href="briefing.html" class="text-sm text-mist hover:text-white transition-colors duration-200">Briefing</a>
        <span class="tag">Live</span>
        <div class="w-2 h-2 rounded-full bg-aurora animate-pulse"></div>
      </div>
    </div>
  </nav>

  <!-- ═══ LAYER SWITCHER ═══ -->
  <div class="layer-switcher" id="layer-switcher">
    <button class="layer-btn active" data-layer="temp">Temperature</button>
    <button class="layer-btn" data-layer="precip">Precipitation</button>
    <button class="layer-btn" data-layer="wind">Wind</button>
  </div>

  <!-- ═══ MAP ═══ -->
  <div id="map"></div>

  <!-- ═══ COORDS BADGE ═══ -->
  <div class="coords-badge" id="coords-badge"></div>

  <!-- ═══ BRIEFING LOADING OVERLAY ═══ -->
  <div id="briefing-overlay">
    <div class="briefing-spinner"></div>
    <div style="font-family:'DM Serif Display',serif;font-size:1.25rem;color:#e8edf5" id="briefing-status-main">Generating Briefing…</div>
    <div style="font-size:0.75rem;color:#8b9ab3;font-family:'Outfit',sans-serif" id="briefing-status-sub">Fetching forecast data</div>
  </div>

  <script>
    // OWM tiles are proxied through /api/map-tiles so the key stays server-side

    // ── US timezone detection (matches index.html logic) ─────────────
    const US_TZ = new Set([
      'America/New_York','America/Chicago','America/Denver','America/Los_Angeles',
      'America/Anchorage','America/Adak','Pacific/Honolulu','America/Phoenix',
      'America/Indiana/Indianapolis','America/Detroit','America/Kentucky/Louisville',
      'America/Indiana/Vincennes','America/Indiana/Winamac','America/Indiana/Marengo',
      'America/Indiana/Petersburg','America/Indiana/Vevay','America/Indiana/Tell_City',
      'America/Indiana/Knox','America/Menominee','America/North_Dakota/Center',
      'America/North_Dakota/New_Salem','America/North_Dakota/Beulah',
      'America/Boise','America/Metlakatla','America/Sitka','America/Yakutat',
      'America/Nome','America/Juneau',
    ]);
    const userTZ   = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const isUS     = US_TZ.has(userTZ);
    const tempUnit = isUS ? 'fahrenheit' : 'celsius';
    const windUnit = isUS ? 'mph' : 'kmh';
    const tempSym  = isUS ? '°F' : '°C';
    const windLbl  = isUS ? 'mph' : 'km/h';

    // ── Map init — centered on Northeast US ──────────────────────────
    const map = L.map('map', {
      center: [43.5, -72],
      zoom: 5,
      zoomControl: false,
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Base: CartoDB Dark Matter (free, no key needed)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CartoDB</a> &copy; <a href="https://openstreetmap.org">OpenStreetMap</a>',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);

    // OWM weather overlay layers — routed through /api/map-tiles proxy (key never in browser)
    const owmLayers = {
      temp:   L.tileLayer('/api/map-tiles?layer=temp_new&z={z}&x={x}&y={y}',          { opacity: 0.72, maxZoom: 19 }),
      precip: L.tileLayer('/api/map-tiles?layer=precipitation_new&z={z}&x={x}&y={y}', { opacity: 0.80, maxZoom: 19 }),
      wind:   L.tileLayer('/api/map-tiles?layer=wind_new&z={z}&x={x}&y={y}',          { opacity: 0.72, maxZoom: 19 }),
    };

    let activeLayer = 'temp';
    owmLayers.temp.addTo(map);

    // ── Layer switcher ────────────────────────────────────────────────
    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const layer = btn.dataset.layer;
        if (layer === activeLayer) return;
        map.removeLayer(owmLayers[activeLayer]);
        owmLayers[layer].addTo(map);
        activeLayer = layer;
        document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // ── Coordinates badge on mousemove ────────────────────────────────
    const coordsBadge = document.getElementById('coords-badge');
    let coordsTimeout;
    map.on('mousemove', e => {
      const lat = e.latlng.lat.toFixed(2);
      const lon = e.latlng.lng.toFixed(2);
      const lonLabel = lon < 0 ? `${Math.abs(lon)}° W` : `${lon}° E`;
      const latLabel = lat >= 0 ? `${lat}° N` : `${Math.abs(lat)}° S`;
      coordsBadge.textContent = `${latLabel}  ${lonLabel}`;
      coordsBadge.classList.add('show');
      clearTimeout(coordsTimeout);
      coordsTimeout = setTimeout(() => coordsBadge.classList.remove('show'), 2000);
    });

    // ── WMO weather code → description ───────────────────────────────
    function wmoDesc(code) {
      const d = {
        0:'Clear sky', 1:'Mainly clear', 2:'Partly cloudy', 3:'Overcast',
        45:'Fog', 48:'Icy fog',
        51:'Light drizzle', 53:'Drizzle', 55:'Dense drizzle',
        61:'Slight rain', 63:'Moderate rain', 65:'Heavy rain',
        71:'Slight snow', 73:'Moderate snow', 75:'Heavy snow', 77:'Snow grains',
        80:'Slight showers', 81:'Moderate showers', 82:'Violent showers',
        85:'Slight snow showers', 86:'Heavy snow showers',
        95:'Thunderstorm', 96:'Thunderstorm + hail', 99:'Thunderstorm + heavy hail',
      };
      return d[code] ?? 'Unknown';
    }

    // ── Wind degrees → compass label ─────────────────────────────────
    function windDir(deg) {
      return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg / 45) % 8];
    }

    // ── Map click → fetch conditions → show popover ───────────────────
    let activePopup = null;

    map.on('click', async e => {
      const { lat, lng } = e.latlng;

      if (activePopup) { map.closePopup(activePopup); activePopup = null; }

      // Show loading state immediately
      activePopup = L.popup({ maxWidth: 300, closeButton: true, autoPan: true, autoPanPaddingTopLeft: [20, 100] })
        .setLatLng(e.latlng)
        .setContent(`<div class="pop-loading">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" stroke-width="2"
            style="animation:loadingSpin 0.8s linear infinite;display:inline-block;margin-bottom:8px">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg><br>Fetching conditions…
        </div>`)
        .openOn(map);

      try {
        // 1. Reverse geocode via Nominatim
        const geoRes  = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`,
          { headers: { 'Accept-Language': 'en' } }
        );
        const geoData = await geoRes.json();
        const addr    = geoData.address ?? {};
        const city    = addr.city ?? addr.town ?? addr.village ?? addr.county ?? addr.state ?? 'Unknown location';
        const cc      = addr.country_code ? addr.country_code.toUpperCase() : '';
        const displayName = cc ? `${city}, ${cc}` : city;

        // 2. Fetch current conditions from Open-Meteo
        const wxRes = await fetch(
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${lat}&longitude=${lng}` +
          `&current=temperature_2m,relative_humidity_2m,weathercode,windspeed_10m,winddirection_10m` +
          `&daily=precipitation_probability_max` +
          `&temperature_unit=${tempUnit}&windspeed_unit=${windUnit}&timezone=auto&forecast_days=1`
        );
        const wx  = await wxRes.json();
        const cur = wx.current;

        const temp   = Math.round(cur.temperature_2m);
        const desc   = wmoDesc(cur.weathercode);
        const wind   = Math.round(cur.windspeed_10m);
        const wdir   = windDir(cur.winddirection_10m);
        const humid  = cur.relative_humidity_2m;
        const precip = wx.daily?.precipitation_probability_max?.[0] ?? '--';

        // Store for use in briefing button onclick
        const safeLocation = displayName.replace(/'/g, "\\'");

        const content = `<div class="pop-inner">
          <div class="pop-label">Weather Snapshot</div>
          <div class="pop-city">${displayName}</div>
          <div class="pop-temp-row">
            <span class="pop-temp">${temp}</span>
            <span class="pop-unit">${tempSym}</span>
          </div>
          <div class="pop-desc">${desc}</div>
          <div class="pop-divider"></div>
          <div class="pop-stats">
            <div>
              <div class="pop-stat-lbl">Wind</div>
              <div class="pop-stat-val">${wind} ${windLbl} ${wdir}</div>
            </div>
            <div>
              <div class="pop-stat-lbl">Humidity</div>
              <div class="pop-stat-val">${humid}%</div>
            </div>
            <div>
              <div class="pop-stat-lbl">Precip. chance</div>
              <div class="pop-stat-val">${precip}%</div>
            </div>
            <div>
              <div class="pop-stat-lbl">Coordinates</div>
              <div class="pop-stat-val">${parseFloat(lat).toFixed(2)}°, ${parseFloat(lng).toFixed(2)}°</div>
            </div>
          </div>
          <button class="pop-btn" onclick="generateBriefing(${lat}, ${lng}, '${safeLocation}', this)">
            <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            Get AI Briefing
          </button>
        </div>`;

        if (activePopup) activePopup.setContent(content);

      } catch (err) {
        if (activePopup) activePopup.setContent(
          `<div class="pop-loading" style="color:#ef4444">Failed to fetch conditions.<br><small style="opacity:0.6">${err.message}</small></div>`
        );
      }
    });

    // ── Generate AI Briefing from map click ───────────────────────────
    async function generateBriefing(lat, lng, locationName, btn) {
      btn.disabled = true;
      btn.textContent = 'Loading…';

      const overlay   = document.getElementById('briefing-overlay');
      const statusMain = document.getElementById('briefing-status-main');
      const statusSub  = document.getElementById('briefing-status-sub');

      overlay.classList.add('show');
      statusMain.textContent = 'Fetching Forecast…';
      statusSub.textContent  = 'Connecting to Open-Meteo';

      try {
        // Full 7-day forecast (mirrors index.html chain)
        const wxRes = await fetch(
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${lat}&longitude=${lng}` +
          `&current=temperature_2m,relative_humidity_2m,weathercode,windspeed_10m,winddirection_10m,apparent_temperature` +
          `&hourly=temperature_2m,weathercode,precipitation_probability,windspeed_10m` +
          `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max,sunrise,sunset` +
          `&temperature_unit=${tempUnit}&windspeed_unit=${windUnit}&timezone=auto&forecast_days=7`
        );
        const forecast = await wxRes.json();

        statusMain.textContent = 'Writing AI Script…';
        statusSub.textContent  = 'Claude is crafting your briefing';

        const bRes = await fetch('/api/briefing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            location: locationName,
            forecast,
            unit: tempUnit,
            temp_symbol: tempSym,
          }),
        });

        if (!bRes.ok) {
          const errData = await bRes.json().catch(() => ({}));
          throw new Error(errData.error ?? errData.detail ?? `Server error ${bRes.status}`);
        }
        const briefing = await bRes.json();

        sessionStorage.setItem('atmosphera_briefing', JSON.stringify({
          ...briefing,
          location: locationName,
          unit: tempUnit,
          temp_symbol: tempSym,
          raw_forecast: forecast,
        }));

        window.location.href = 'briefing.html';

      } catch (err) {
        overlay.classList.remove('show');
        btn.disabled = false;
        btn.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> Get AI Briefing`;
        alert(`Could not generate briefing: ${err.message}`);
      }
    }
  </script>
</body>
</html>
